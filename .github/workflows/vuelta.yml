name: Renfe Sniper Bot

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

jobs:
  buscar-billetes:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TZ: Europe/Madrid

      # Secrets
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Repository Variables
      ORIGEN: ${{ vars.VUELTA_ORIGEN }}
      DESTINO: ${{ vars.VUELTA_DESTINO }}
      FECHA: ${{ vars.VUELTA_FECHA }}
      SALIDA: ${{ vars.VUELTA_SALIDA }}
      LLEGADA: ${{ vars.VUELTA_LLEGADA }}
      DURACION: ${{ vars.VUELTA_DURACION }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Ejecutar Bot
        run: |
          python -u run_auto.py \
            -o "$ORIGEN" \
            -d "$DESTINO" \
            -f "$FECHA" \
            -s "$SALIDA" \
            -l "$LLEGADA" \
            -t "$DURACION" \
            --intervalo-minimo 5 \
            --intervalo-maximo 10 \
            --max-minutos 45
